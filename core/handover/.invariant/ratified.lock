{
  "ratified": {
    "by": "gitdek",
    "at": "2026-11-13T23:09:17Z",
    "issue": 1,
    "comment": "https://github.com/gitdek/onair/issues/1#issuecomment-6867217748",
    "proposal": "sha256:f8602fadba837ea6b069fbd60a4e906ac3aa43e36f82609594d02c6fe8a9ab34"
  },
  "bounds": {
    "MaxAttempts": "2",
    "MaxCleanupAttempts": "2",
    "MaxDifferences": "2",
    "OtherRecording": "\"unrelated.wav\"",
    "Recording": "\"recording.wav\""
  },
  "statements": [
    {
      "name": "Spec",
      "kind": "spec",
      "says": "The hand-over starts in its initial state and proceeds through the modeled core and caller steps.",
      "sha256": "sha256:aa859c85c48ce29fa4d4ab0286b96978d11ebb8c97b53b332cf84f294ab53e75"
    },
    {
      "name": "PublicationIsVerified",
      "kind": "invariant",
      "says": "The core requests publication only after the hidden copy was found identical to the spool file, and every publication carries that evidence.",
      "sha256": "sha256:b46fb6720b7f29efde05ff3c8f1211ac1a79a66dbced84010961f74d86d673a0"
    },
    {
      "name": "SpoolRemovalIsSafe",
      "kind": "invariant",
      "says": "The original is requested for removal or removed only after verified delivery and expiry of its retention time.",
      "sha256": "sha256:e466a0e0854ef6ccc924e26420d8e05ce6a0ef4b9e56487a2cc56d15a75016ce"
    },
    {
      "name": "NoCopyAfterPublication",
      "kind": "invariant",
      "says": "Once the recording has been published, the core never requests another copy, including after an interruption before recording success.",
      "sha256": "sha256:562c433461ef9549253bd5fda39700bc2d9e302036a9d7d74c0593adccac93a0"
    },
    {
      "name": "OneCopyAtATime",
      "kind": "invariant",
      "says": "At most one copy of the recording is being executed at a time.",
      "sha256": "sha256:715a35f138298b6dfe928f2de902ae5fdc374bf3bd2735a354368269c9679940"
    },
    {
      "name": "ReplayKeepsIdentity",
      "kind": "invariant",
      "says": "A repeated request retains the saved operation, names and identity, including while its execution or result is outstanding.",
      "sha256": "sha256:48d169b4d482c577edaa7938f7c34a5037604557d2704e64a307809fb7e7a232"
    },
    {
      "name": "OnlyOwnedNames",
      "kind": "invariant",
      "says": "Every request to change or remove a file targets only the appropriate hidden name, recording name or original spool file belonging to this hand-over.",
      "sha256": "sha256:4396dd479acb46a7a5dc1d1ed7e15eb1f308db1f639d7bb486a381767d965c1e"
    },
    {
      "name": "CopiesAreHidden",
      "kind": "invariant",
      "says": "Every copy request uses the hand-over’s hidden name with a leading dot.",
      "sha256": "sha256:a32ef6509740060508343e61c811d8866698535e0cc891b20efb9c8bc9cd63f1"
    },
    {
      "name": "NewCopiesStartCleanly",
      "kind": "invariant",
      "says": "A new copy is requested only after any previous hidden copy has been removed.",
      "sha256": "sha256:d1b04e9f3aff258d04b5b4692df7cce7a434aea07b130d8b06327ca4b943517b"
    },
    {
      "name": "DifferenceLimitStopsCopying",
      "kind": "invariant",
      "says": "Reaching the configured limit of differing copies permits only their cleanup before the attempt finishes.",
      "sha256": "sha256:4d61a8a08a7c13aabf50ccdbdc4b6798de523b0c8573437c894048bc9db50b5c"
    },
    {
      "name": "AtMostOnePublication",
      "kind": "invariant",
      "says": "The recording is published at most once across all interruptions and retries.",
      "sha256": "sha256:55ca99520f717da9bba4fe2b565557d1b4683745fad2d3ed358f0534c4704455"
    },
    {
      "name": "ForeignFileIsPreserved",
      "kind": "invariant",
      "says": "A file already occupying the final name is never replaced or removed by this hand-over.",
      "sha256": "sha256:40518ae36b4bcac91f25ce68bbf49f88d6a7dbb57563299c0dc9013d200a66ec"
    },
    {
      "name": "SuccessHasEvidence",
      "kind": "invariant",
      "says": "A successful hand-over has an identical file at its final name and recorded verification evidence.",
      "sha256": "sha256:d85a726ac1bed865c148718c5ddd7c1fdcd610fc0d87e333967db8564721c88b"
    },
    {
      "name": "FailureKeepsSpool",
      "kind": "invariant",
      "says": "A failed hand-over records its reason and retains the original spool file.",
      "sha256": "sha256:5c5065e25f6917a16c3b5ec97e179335bac7191a4e10d6c6b7c83e8cef566440"
    },
    {
      "name": "DifferentCopyIsNotPublished",
      "kind": "invariant",
      "says": "A differing hidden copy never carries permission to be published.",
      "sha256": "sha256:e7cf51737f5b4061de59ed51ddfedabddb97e5e7dec400e49e4bbad266e831f4"
    },
    {
      "name": "DifferenceLimitCleansUp",
      "kind": "invariant",
      "says": "An attempt that fails for exhausting its differing-copy limit has removed the last differing copy.",
      "sha256": "sha256:4c5853bce0f6c7df901477b648952a8bcf90a38e3d2f84d8cb67db90deb169c2"
    },
    {
      "name": "ExistingMatchAvoidsCopy",
      "kind": "invariant",
      "says": "An identical file present at the final name when the hand-over begins is accepted without making a copy.",
      "sha256": "sha256:6dfd4a855940db1e51d820b2cef6ae6b40421b8b82c2056fb2e683a95613a3d0"
    },
    {
      "name": "CleanupCannotUndoDelivery",
      "kind": "invariant",
      "says": "Waiting for retention, removing the original, or failing and retrying that removal leaves the hand-over successful.",
      "sha256": "sha256:bc79cae346f1198350434cbfecb5d996963f39192bad7c78b92e7c19787c7df6"
    },
    {
      "name": "TypeOK",
      "kind": "invariant",
      "says": "Every state component stays within its declared type and exploration bounds.",
      "sha256": "sha256:9e05e2211789b91986d90ad6147c0f9e30eda8b2b9dee12f81200310f4bdfbb2"
    },
    {
      "name": "DeliveredByCopy",
      "kind": "witness",
      "says": "A new copy can be verified and published while the original remains in the spool.",
      "sha256": "sha256:10f65bef4a3f0c7e64809d922cda3ab0a9decbceee87238a9b3b5ef5c32f5639"
    },
    {
      "name": "AcceptedExisting",
      "kind": "witness",
      "says": "An identical existing file can be accepted without copying.",
      "sha256": "sha256:24252c5f75d44997a210d08561eed450e13a7772cce305e483c068c9f13e81ab"
    },
    {
      "name": "ConflictingName",
      "kind": "witness",
      "says": "A differing existing file can cause a name-conflict failure while remaining unchanged.",
      "sha256": "sha256:8f7affa049dc77444419144698be9e872b7daa304ede113da0a8364a39b06cab"
    },
    {
      "name": "FolderGone",
      "kind": "witness",
      "says": "A missing folder can end the hand-over with that failure reason.",
      "sha256": "sha256:2e857f14dd468b5cdfb00825342cf03bc63eac04b90b913a0921ecdd4509c0bd"
    },
    {
      "name": "FolderFull",
      "kind": "witness",
      "says": "A full folder can end the hand-over with that failure reason.",
      "sha256": "sha256:b019bc661b00b36503f0c43855c83caf18ea01c49d2aedec845c22af96a39a4f"
    },
    {
      "name": "DifferencesExhausted",
      "kind": "witness",
      "says": "Repeated differing copies can reach the limit, be cleaned up and produce the specified failure.",
      "sha256": "sha256:1ddb25d1caf3a58d4eb06a45be595a6db68456c423f90992fc282e17b792773c"
    },
    {
      "name": "ReplacedDifferentCopy",
      "kind": "witness",
      "says": "A differing copy can be removed and replaced by a copy that is successfully handed over.",
      "sha256": "sha256:2007912d84140c5670034966d484184ec03d15429d35de57ba805ae2f3ec60fb"
    },
    {
      "name": "RetriedDelivery",
      "kind": "witness",
      "says": "A failed hand-over can be retried successfully.",
      "sha256": "sha256:6b24d6fc52ba7dcc3d935a26e969cc548b18992dad3df8676c3cb5f03b1c7dee"
    },
    {
      "name": "RecoveredPublication",
      "kind": "witness",
      "says": "An interruption after publication but before recording success can be recovered by repeating the original request.",
      "sha256": "sha256:7ad8e9531685d5f925539584e73859d2683ae3d69f1144df3ee3d1167f997a44"
    },
    {
      "name": "RetainingOriginal",
      "kind": "witness",
      "says": "A successful hand-over can retain its original while the retention time has not elapsed.",
      "sha256": "sha256:71006499e7849e2505767b668c50f854d988285df67376e9a28025bfaf361e08"
    },
    {
      "name": "OriginalRemoved",
      "kind": "witness",
      "says": "The original can be removed after successful hand-over and expiry of retention.",
      "sha256": "sha256:9403a2a8ea1ee88719c0562d791949c477765fe9336afed31243e7243e7f43b4"
    },
    {
      "name": "CleanupFailed",
      "kind": "witness",
      "says": "Removal of the original can fail while the hand-over stays successful and the original remains.",
      "sha256": "sha256:a2f009d8bd528af1a503252661e5a320430c5003fe5917d87eed5fcc4cf647fc"
    },
    {
      "name": "CleanupRetried",
      "kind": "witness",
      "says": "A failed removal of the original can be retried successfully.",
      "sha256": "sha256:0d68985842a014e875d3bc07f350df294671ae3dc4446bc2925668be4940af28"
    },
    {
      "name": "IssueProgress",
      "kind": "fairness",
      "says": "If issuing the next saved request is possible repeatedly, the core eventually issues it.",
      "sha256": "sha256:e78553b29c0e40b1d02caf14efcdf1a7ad74533618fc436a6d825813a7775dfc"
    },
    {
      "name": "ResendProgress",
      "kind": "fairness",
      "says": "If repeating an interrupted request is possible repeatedly, the core eventually repeats it.",
      "sha256": "sha256:785f4fddc2e1156963ef70a74cf5bf363ca9171b31c2714bed365a1f2a17701b"
    },
    {
      "name": "ConsumeProgress",
      "kind": "fairness",
      "says": "If recording a completed caller result is possible repeatedly, the core eventually records it.",
      "sha256": "sha256:f446e6c131aab834ba734dce5da1745ba77141dd3eaa0b315b1dee068296205b"
    },
    {
      "name": "RetentionProgress",
      "kind": "fairness",
      "says": "If starting original removal after retention is possible repeatedly, the core eventually starts it.",
      "sha256": "sha256:27ce00cd4618001a4ae99e7370e31996f6eaa5e8bbb0b8a4dc53777675a76822"
    },
    {
      "name": "StartedAttemptFinishes",
      "kind": "property",
      "says": "If execution keeps resuming and the caller eventually answers outstanding requests, each started attempt eventually reports success or failure.",
      "sha256": "sha256:7558cdb8fd13141b5a1d6c4b9ce459feb902f6ebadb4f045d5c64b0dc49d9ce3"
    },
    {
      "name": "PublishUnchecked",
      "kind": "bug",
      "says": "The core requests publication before comparing the copy.",
      "expect": "PublicationIsVerified",
      "sha256": "sha256:2e3f80037fbf8be62819df016a661f910e6cc9846af2f82bb16942fd83003bcc"
    },
    {
      "name": "RemoveSpoolEarly",
      "kind": "bug",
      "says": "The core requests removal of the original before delivery.",
      "expect": "SpoolRemovalIsSafe",
      "sha256": "sha256:c8046c94be7d4f0f862080f6b7a31325f54e23fe83ebb273a26e4469090e7d64"
    },
    {
      "name": "RestartAfterUnrecordedPublication",
      "kind": "bug",
      "says": "After an interrupted publication, recovery requests a fresh copy instead of repeating the saved publication request.",
      "expect": "NoCopyAfterPublication",
      "sha256": "sha256:75ea0b2f1affc5d51f740b468a0857a05a8905fe6f6d77feaa5f6858c58e911d"
    },
    {
      "name": "CopyWhileBusy",
      "kind": "bug",
      "says": "A second copy is started while the first copy is still in progress.",
      "expect": "OneCopyAtATime",
      "sha256": "sha256:8d5384a95c993f781777250e29af0c7951f1e4638dc3d981f736ce2a23d1cf80"
    },
    {
      "name": "RemoveUnrelatedFile",
      "kind": "bug",
      "says": "Discarding a differing copy mistakenly requests removal of an unrelated file.",
      "expect": "OnlyOwnedNames",
      "sha256": "sha256:f0673af1325c2824a8686c8071b6354ce4b1399b127f22c68d66d16e53afae1b"
    }
  ]
}
