{
  "ratified": {
    "by": "gitdek",
    "at": "2026-11-19T11:57:32Z",
    "issue": 10,
    "comment": "https://github.com/gitdek/onair/issues/10#issuecomment-7008406191",
    "proposal": "sha256:5e13afb3e696ae7993915af0da12f5c9a54c27ef4a2fabb6dadad1059ce7523c"
  },
  "bounds": {
    "MaxFreeBytes": "22",
    "MaxPieceBytes": "2",
    "ReserveBytes": "10",
    "StartBytes": "20"
  },
  "statements": [
    {
      "name": "Spec",
      "kind": "spec",
      "says": "The guard starts in Init and follows the modeled caller events, space decisions and piece writes.",
      "sha256": "sha256:1db309688fd054d07c9c052599ba3ff92cb73e75a4ea56dbc7a9461bdf40de0e"
    },
    {
      "name": "RoomToStart",
      "kind": "invariant",
      "says": "A new Start is allowed exactly when the reading supplied for that Start succeeds and shows at least the start threshold.",
      "sha256": "sha256:8a27cb5891a2bec3a3aad0f31b9b65977ba2e5ea28f8e0576212ed94c42585e2"
    },
    {
      "name": "ContinuationDecision",
      "kind": "invariant",
      "says": "A piece reading or resumption check permits capture exactly when its reading succeeds with at least the reserve plus two maximum pieces and no stop was already requested.",
      "sha256": "sha256:a74c115c3f06c9cef493401d3129e2dc4e765604d7a3970b9a4edfc4d1832525"
    },
    {
      "name": "OwnPiecesPreserveReserve",
      "kind": "invariant",
      "says": "With only the running recording's pieces consuming space and the stated write bounds respected, those pieces never reduce free space below the reserve.",
      "sha256": "sha256:da7fcea590b6557e0ce2ff1ffbe56add1b7ea0954945ea84b4ab375d1fe0cbe5"
    },
    {
      "name": "OneStop",
      "kind": "invariant",
      "says": "The live guard emits at most one disk stop before capture ends for good or the guard crashes.",
      "sha256": "sha256:79e1f7d09510fd872533fdf38fc8ec06f171c7d3dc22b80f5d5bcb7aaef6dfc9"
    },
    {
      "name": "StopIsLatched",
      "kind": "invariant",
      "says": "A requested disk stop remains requested until capture ends for good or the guard crashes.",
      "sha256": "sha256:618e6272e4cf2e03ec80a9d7a12e87467a1214cb0264c3899533a795d61e3de5"
    },
    {
      "name": "NoCaptureWhileStopRequested",
      "kind": "invariant",
      "says": "No answer allows capture while a Stop is requested.",
      "sha256": "sha256:8a319670ee216866c1c1fed7d7d8fb01c25ece5f6aed74eb33f9748c1a523cea"
    },
    {
      "name": "TypeOK",
      "kind": "invariant",
      "says": "Every state value has its declared type and the parameters leave ample space between the start threshold and the stopping threshold.",
      "sha256": "sha256:afe4675da08efe64ef7ef2291576334746febf32fe089c754fea15599ecfcb36"
    },
    {
      "name": "StartRefusalExplainsSpace",
      "kind": "invariant",
      "says": "Every refused Start supplies the menu with that Start's free-space reading or its failure and the required start threshold.",
      "sha256": "sha256:fa25273a79fdbd3fa0e0646ad0b7f49a279992ef816ba253d97e05dcc831717c"
    },
    {
      "name": "UnsafeReadingRequestsStop",
      "kind": "invariant",
      "says": "A failed or insufficient piece or resumption reading has a disk stop requested in the same decision.",
      "sha256": "sha256:2ad67754a0d1ed59766ee6de4a9205fdfa7d637c8c93913c7ced3b1c3d165277"
    },
    {
      "name": "StopEmissionIsExact",
      "kind": "invariant",
      "says": "A piece or resumption check emits a new stop exactly when its reading fails or falls below the stopping threshold and no stop was already requested.",
      "sha256": "sha256:a45379c3c3f1f1004404fdc43754c6b46b6e3f59758abc70081b8cce2ec8afd1"
    },
    {
      "name": "OrdinaryStopWithReason",
      "kind": "invariant",
      "says": "Every disk stop is the ordinary Stop command with the reason that the disk is nearly full.",
      "sha256": "sha256:54a9b590bf1fc5bd623cefc49c1735b8114d4a2ba3035838581b6b62ab099841"
    },
    {
      "name": "CaptureNeedsPermission",
      "kind": "invariant",
      "says": "Capture is admitted and runs only with an allowing decision and no requested disk stop.",
      "sha256": "sha256:39ed35db4392343402a27c5d7c383b9b9dd0cb4a95d360d476ecb9034ea60588"
    },
    {
      "name": "StartAtBoundary",
      "kind": "witness",
      "says": "A Start reading exactly at the start threshold can lead to running capture.",
      "sha256": "sha256:a3079ce8a74211a093ef6952aa30e55be6e64aa125bdac71a751ed4c592368aa"
    },
    {
      "name": "StartBelowBoundaryRefused",
      "kind": "witness",
      "says": "A Start reading one unit below the start threshold can be refused.",
      "sha256": "sha256:7f7342407577e9cb6d0375fff00df0a1ee37e0bd04109192f6b16096f651e982"
    },
    {
      "name": "FailedStartRefused",
      "kind": "witness",
      "says": "A failed Start reading can be refused.",
      "sha256": "sha256:06a13bd183a8cb24f856588b33a23fd9fd741e548c8b51f14b2806f561635a02"
    },
    {
      "name": "ContinueAtBoundary",
      "kind": "witness",
      "says": "A running recording can continue at exactly the reserve plus two maximum pieces.",
      "sha256": "sha256:bf96bcf1710fad4226ca4d04f4c1993073cb3a1b03947364fef77518974da4a6"
    },
    {
      "name": "StopJustBelowBoundary",
      "kind": "witness",
      "says": "A running recording can request its stop at the first reading one unit below the stopping threshold.",
      "sha256": "sha256:da541e121fb9cc252fd721ef5489e2de6fe04cd41f34b36252aff9de83047585"
    },
    {
      "name": "FailedRunningReadStops",
      "kind": "witness",
      "says": "A failed reading during capture can request an ordinary disk stop.",
      "sha256": "sha256:f571633058339072f174748fb6d93edccf41d7ac92cf360f06e6d20d8d11b05c"
    },
    {
      "name": "ResumeBelowStartLine",
      "kind": "witness",
      "says": "An existing recording can resume at the stopping threshold even though it has less than the start threshold free.",
      "sha256": "sha256:313b73a9859cfab3d4f69cf869863ab6eca5ce2a6093d0ac1c1d794defab4bf0"
    },
    {
      "name": "UnsafeResumeFinishesExisting",
      "kind": "witness",
      "says": "An insufficient resumption reading can request finishing the existing recording without opening another piece.",
      "sha256": "sha256:92bff3e51d0d98bac4d7435cc94db902bb0d3ee4d4c6d878275e0994d6b914d8"
    },
    {
      "name": "FailedResumeFinishesExisting",
      "kind": "witness",
      "says": "A failed resumption reading can request finishing the existing recording without opening another piece.",
      "sha256": "sha256:0c08c9fff7d6add8320c954b1c2d739890a9dd895b013e24b7f2cb74c9c23491"
    },
    {
      "name": "StopSurvivesGoodReading",
      "kind": "witness",
      "says": "A later sufficient reading can leave a previous stop in force without emitting it again or permitting capture to resume.",
      "sha256": "sha256:d6b176f5371c64e02c065cfa1899d292c4559491bba54c3641d5d2f8133eb7a9"
    },
    {
      "name": "FinalPieceUsesLastRoom",
      "kind": "witness",
      "says": "The final open piece can finish at exactly the reserve after a disk stop.",
      "sha256": "sha256:ca5f4b334779ac6004243e480f646afa414248ca5e13818b00f325dc5c301fc2"
    },
    {
      "name": "FinishedAndReusable",
      "kind": "witness",
      "says": "A recording stopped for disk space can close its final piece at the reserve, end for good, and leave the guard ready for a new Start with its old stop cleared.",
      "sha256": "sha256:8c1222884b1b34167a2670be3dfb08faf59f73349e7137dd3b6d717e88d5b198"
    },
    {
      "name": "BugStaleStart",
      "kind": "bug",
      "says": "A possible implementation grants a new Start using old free-space information despite that Start's insufficient or failed reading.",
      "expect": "RoomToStart",
      "sha256": "sha256:f0a572e363417c29040420ee5b61e937b84319a4567910656e29f3afb8e6cd03",
      "code_behavior": "hypothetical"
    },
    {
      "name": "BugStartAtReserve",
      "kind": "bug",
      "says": "A possible implementation grants a new Start at the reserve instead of requiring the start threshold.",
      "expect": "RoomToStart",
      "sha256": "sha256:7cf61712e14c979b0b648ae234f5bf099668f3c44bd2057ff81676003a93d8c7",
      "code_behavior": "hypothetical"
    },
    {
      "name": "BugFailedStartAllowed",
      "kind": "bug",
      "says": "A possible implementation treats a failed Start reading as permission to start.",
      "expect": "RoomToStart",
      "sha256": "sha256:ada9f58989bc236dbb8415b08c0ac084375259d812e2050566e1fe68ade85044",
      "code_behavior": "hypothetical"
    },
    {
      "name": "BugStopOnlyBelowReserve",
      "kind": "bug",
      "says": "A possible implementation waits until space is below the reserve and permits capture on a piece reading at or above the reserve but below the stopping threshold.",
      "expect": "ContinuationDecision",
      "sha256": "sha256:5cbcb2fc7a957b96f59245c8c2cf9b67d3d7fa32bd287696a2dfb6cf06997a98",
      "code_behavior": "hypothetical"
    },
    {
      "name": "BugOnlyOnePieceMargin",
      "kind": "bug",
      "says": "A possible implementation continues with room for only one maximum piece above the reserve.",
      "expect": "ContinuationDecision",
      "sha256": "sha256:5cf7e061701f299ad9e19b87dc364b7e553b7c864e5be34d1e5336656f573471",
      "code_behavior": "hypothetical"
    },
    {
      "name": "BugFailedRunningReadAllowed",
      "kind": "bug",
      "says": "A possible implementation continues recording after a failed running reading.",
      "expect": "ContinuationDecision",
      "sha256": "sha256:95bae0b7b0baf2c0c3be4e3f1f2b2a438d59e19733831b2456fe9ce85451531d",
      "code_behavior": "hypothetical"
    },
    {
      "name": "BugResumeRequiresStartLine",
      "kind": "bug",
      "says": "A possible implementation refuses safe resumption because the reading is below the new-Start threshold.",
      "expect": "ContinuationDecision",
      "sha256": "sha256:88464e0eab297b2096c28f4c285f8375b069d90085782afdeb2ae8fbf528dfa8",
      "code_behavior": "hypothetical"
    },
    {
      "name": "BugDuplicateStop",
      "kind": "bug",
      "says": "A possible implementation forgets the requested stop while answering a failed final-piece reading and emits a second disk stop.",
      "expect": "OneStop",
      "sha256": "sha256:7656d4dce5d23996e1465fb1b1db7ffb2d9277de81e6136e55c7c085dcadb021",
      "code_behavior": "hypothetical"
    },
    {
      "name": "BugForgetStopOnGoodReading",
      "kind": "bug",
      "says": "A possible implementation forgets the requested stop while answering a sufficient final-piece reading and permits capture despite the Stop still in force.",
      "expect": "NoCaptureWhileStopRequested",
      "sha256": "sha256:164e6b4d3203ea77a51cd6ee07c0d0011521a3e1c9edfe937668e777b71ad938",
      "code_behavior": "hypothetical"
    },
    {
      "name": "BugWithdrawStop",
      "kind": "bug",
      "says": "A possible implementation withdraws a requested disk stop when enough free space is available.",
      "expect": "StopIsLatched",
      "sha256": "sha256:6d898e71def3360237ee3bfb4cf7a1f64f24cfa20badc6f8f19a9dd97fa2cd66",
      "code_behavior": "hypothetical"
    },
    {
      "name": "BugWriteAfterFinalPiece",
      "kind": "bug",
      "says": "A possible implementation writes another piece after the stopped recording's final piece has exhausted its safe margin.",
      "expect": "OwnPiecesPreserveReserve",
      "sha256": "sha256:2543e07ef9f21b7e89dc9f45c524af946776f06a33c1ac4ba9dfaddd3bc17b32",
      "code_behavior": "hypothetical"
    }
  ]
}
