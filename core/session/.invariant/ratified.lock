{
  "ratified": {
    "by": "gitdek",
    "at": "2026-11-14T17:38:22Z",
    "issue": 8,
    "comment": "https://github.com/gitdek/onair/issues/8#issuecomment-6881580339",
    "proposal": "sha256:0ff1db1a87c73e5098d41354253b514703122299a93449e7e7afcfa5e5f93b8a"
  },
  "bounds": {
    "Errors": "{fault}",
    "MaxRestarts": "2",
    "Recordings": "{r1, r2}"
  },
  "statements": [
    {
      "name": "Spec",
      "kind": "spec",
      "says": "The session starts in its initial state and changes only by the modeled steps.",
      "sha256": "sha256:ed61e5ac148018b3b1339a559857e618008c777f785511210b21cea4d98d5513"
    },
    {
      "name": "OneRunning",
      "kind": "invariant",
      "says": "At most one recording is running, including while its capture is starting or waiting to restart.",
      "sha256": "sha256:5c3018a132b894b397dce8614ed6bef88083835410fc6bc47138753f30511082"
    },
    {
      "name": "EveryAcceptedIsAccountedFor",
      "kind": "invariant",
      "says": "Every accepted recording stays in the saved record until it has ended and its end has actually been shown.",
      "sha256": "sha256:c062e94ec21ffeb1c4cf4eb43425f49af681f3dbb2f77ae3ed093f5795f4d7e6"
    },
    {
      "name": "StopIsLatched",
      "kind": "invariant",
      "says": "A Stop is saved even during startup before capture is asked to stop, and a Stop naming no running recording changes nothing.",
      "sha256": "sha256:e1783aeac7eb16c2ebe7895706014a7f4289ed40a7dca663896226b67cb23424"
    },
    {
      "name": "FinishAfterCapture",
      "kind": "invariant",
      "says": "Finishing is requested only after that recording’s capture has ended for good and can no longer write pieces.",
      "sha256": "sha256:0b05bc75a2d80c9776ff7e52a5dc39c8873d798b94150410c57dc13992fefa31"
    },
    {
      "name": "TypeOK",
      "kind": "invariant",
      "says": "The saved records, requests, reported results and specification histories have the declared bounded types.",
      "sha256": "sha256:8f1d6788ce1c9ae4d5cb88a81d12580ee82c2ba3193c188bbd5e186b4ddc96de"
    },
    {
      "name": "StartDecision",
      "kind": "invariant",
      "says": "A Start reaching this component is accepted whenever no recording is running, and otherwise is refused with a menu notice without changing the saved recordings.",
      "sha256": "sha256:42c2334cb7692ce5a8b7d5b1fad0c152f1518ab33f3cf3fcfa5612cdd192695a"
    },
    {
      "name": "CaptureBelongsToRunning",
      "kind": "invariant",
      "says": "Every capture request belongs to the running recording and uses its original capture selection.",
      "sha256": "sha256:c3af3482b9a034254bedcfe764287680d11e1dbe13c4dc84a7f2a1ce9e5019ae"
    },
    {
      "name": "ExactlyOneEnd",
      "kind": "invariant",
      "says": "An accepted recording has at most one end, whose reported result stays unchanged while its end awaits acknowledgement.",
      "sha256": "sha256:2bec81178516b3ea7a3a1dc4dbdfcfb237978210f6168a3323c8cffe13be6e7a"
    },
    {
      "name": "KeptHasError",
      "kind": "invariant",
      "says": "Every kept recording has the error reported by finishing.",
      "sha256": "sha256:b6ca0d1312acba9be7d3c50fb1674a02817df9046379c79ba0de472da44b67b3"
    },
    {
      "name": "NothingRecordedIsKept",
      "kind": "invariant",
      "says": "A report that nothing was recorded ends kept with an error saying that nothing was recorded and giving the reason its capture ended for good.",
      "sha256": "sha256:06465132a6e309267020648604bdfc3945906d6c54d323d4e83fcb14fdc3cd60"
    },
    {
      "name": "UnshownEndIsSaved",
      "kind": "invariant",
      "says": "Every end that has not been shown is still in the saved record.",
      "sha256": "sha256:284d6c259a13f73cf6f76736c458c31d50ca15f9603a9abd6e4f8a9af9e6afc9"
    },
    {
      "name": "EndNoticeIsExact",
      "kind": "invariant",
      "says": "Each end notice gives the exact reported outcome and error and identifies the recording’s original pieces directory.",
      "sha256": "sha256:369e6b384fd7673ce35e4901036eb595dd65b2be3b26b107ac7188cfddaf11f1"
    },
    {
      "name": "StartingStopIsImmediate",
      "kind": "invariant",
      "says": "When capture reports that startup succeeded after a saved Stop, the session immediately asks that capture to stop.",
      "sha256": "sha256:52fb6dd4f632de05566e736f5e9d8b241b313ba1fca124ad16152f521250a4a6"
    },
    {
      "name": "NoStartAfterStop",
      "kind": "invariant",
      "says": "No capture start or restart is requested for a recording after its Stop has been accepted.",
      "sha256": "sha256:34ed247fce2941b7871d9010c829ed41e06891d48fdbc1a8ac975dfc3e72f800"
    },
    {
      "name": "AutomaticStopExplained",
      "kind": "invariant",
      "says": "An automatic Stop of the named running recording emits a menu notice carrying its caller-provided reason.",
      "sha256": "sha256:51f3e66c8a39ff25dc946040459357e499dd8b6990289b2d7b036f8cb920d02c"
    },
    {
      "name": "RestartBudgetIsSaved",
      "kind": "invariant",
      "says": "Each restart request consumes one saved retry before capture is asked to start, including requests interrupted by a crash, and never exceeds the bound.",
      "sha256": "sha256:22f1b3ff32b738ce3c9ccd48d71b4e16b46016ea522bacffd57ac37c98ffc899"
    },
    {
      "name": "RestartShowsGap",
      "kind": "invariant",
      "says": "A successful restart uses the same recording and emits one gap notice, while an initial start emits no gap notice.",
      "sha256": "sha256:1bdafaac0ebbac6dcd73923018b478656919367cc48e103e40c1677418a832e7"
    },
    {
      "name": "OneFinishInOrder",
      "kind": "invariant",
      "says": "Only the earliest recording whose capture ended for good and whose finish is unanswered may be finishing, with at most one finish request in progress.",
      "sha256": "sha256:e1fb52c1471bb45b431f268cc95e2c2a8f8fe188a113d8802b9b507ccb95aaaf"
    },
    {
      "name": "GapKeepsRecording",
      "kind": "invariant",
      "says": "An unexpected capture end or a new launch keeps the same recording open for restart if it has no saved Stop and still has retry budget.",
      "sha256": "sha256:62677c3148f3a0a6c47053056434280938f66f9a269386245a8f6a09e9f79d25"
    },
    {
      "name": "CaptureFailureCloses",
      "kind": "invariant",
      "says": "When the caller reports that capture cannot start, the recording’s capture ends for good and its reported reason accompanies the queued finish.",
      "sha256": "sha256:42e725c6ecd5b309aa4656bd7316b97ecbb7666205d92b0839d56969cd3e12bb"
    },
    {
      "name": "AcknowledgedEndsAreRemoved",
      "kind": "invariant",
      "says": "Once the caller acknowledges that an end was displayed, its recording is removed from the saved record.",
      "sha256": "sha256:bc500e3de11ce72dea04dbc1193c4cf59043b14039a4d794d5197031f2e8b8f5"
    },
    {
      "name": "CrashKeepsSavedRecord",
      "kind": "invariant",
      "says": "A crash ends all capture and discards pending caller requests while preserving the whole saved record and finishing order.",
      "sha256": "sha256:0d05359b872c2f7cc81af88c89a756106c7c22aab9c91ff8ab508dcd39344569"
    },
    {
      "name": "StoppedOrClosedEndsAndIsShown",
      "kind": "property",
      "says": "If On Air eventually keeps running and its caller answers each request, every stopped recording or recording whose capture ended for good eventually ends, has its end shown and leaves the saved record.",
      "sha256": "sha256:dfb0054418caeb8492337e9ee0c200cc5a0de621ecc2a7a7559731e85614fd70"
    },
    {
      "name": "GapsAreResolved",
      "kind": "property",
      "says": "If On Air eventually keeps running and its caller answers each request, every gap eventually leads to a counted restart request or capture ending for good.",
      "sha256": "sha256:48e26762a1e334d960c3d11cd115fe4b8f8948d3c58e195817f694b4324bc9f6"
    },
    {
      "name": "ResolveGapFair",
      "kind": "fairness",
      "says": "The session eventually resolves a pending gap whenever resolving it stays possible.",
      "sha256": "sha256:b4cccbc49aa92ea05cf1a9cf0220afd1cf22ce51a7194d984412400be6c2144d"
    },
    {
      "name": "SendStopFair",
      "kind": "fairness",
      "says": "The session eventually asks started capture to stop whenever a saved Stop keeps that request possible.",
      "sha256": "sha256:0643c015a518d019b7704209cde90dec0374dfda80372422fbfb06e06436d1ed"
    },
    {
      "name": "FinishDispatchFair",
      "kind": "fairness",
      "says": "The session eventually requests the next finish whenever dispatching it stays possible.",
      "sha256": "sha256:e718c28ee29d1198a31c67f208963f9a45bba5357f4cb7fb2f6e3517989631d9"
    },
    {
      "name": "EndNoticeDispatchFair",
      "kind": "fairness",
      "says": "The session eventually requests an unacknowledged end notice whenever requesting that notice stays possible.",
      "sha256": "sha256:9d5dce53164f144bb077f885fd978b8e28c5ded418e2357c658237579492996f"
    },
    {
      "name": "HandedOver",
      "kind": "witness",
      "says": "A recording can end handed over.",
      "sha256": "sha256:a83fc371e5db64ec42aa35280175fe034c2acb8c224b2703d7646e7b0495357b"
    },
    {
      "name": "HandedOverWithWarning",
      "kind": "witness",
      "says": "A recording can end handed over with a finishing error to show.",
      "sha256": "sha256:49a9319eab4beb782cf217bdc3f8ed0341604b2a5a18814833573ca1b14d62ce"
    },
    {
      "name": "KeptWithError",
      "kind": "witness",
      "says": "A recording can end kept with a finishing error.",
      "sha256": "sha256:7354a1300169af3e0323a472b33787b7e63e6e5c87b5e6bda1658cd637f3c0a1"
    },
    {
      "name": "NothingRecorded",
      "kind": "witness",
      "says": "A recording can end kept because nothing was recorded.",
      "sha256": "sha256:c000716149fa8f8d84ad51d10c2897b03a4ae4cd088ea027ac3b89f9d1548a45"
    },
    {
      "name": "EndAcknowledged",
      "kind": "witness",
      "says": "All accepted recordings can have their ends shown and leave the saved record.",
      "sha256": "sha256:26241a65d06cc684881c02d32997170dda61dbc09c63bca6b1b83175745c65fb"
    },
    {
      "name": "StartDuringFinishing",
      "kind": "witness",
      "says": "A new recording can be running while an earlier one is being finished.",
      "sha256": "sha256:ea5e1b8e16e36a9232995b0c0c253329d275c2a482daf97b44fc3e9510370a77"
    },
    {
      "name": "RefusalIsPossible",
      "kind": "witness",
      "says": "A Start can be refused with its menu notice while another recording is running.",
      "sha256": "sha256:8e6dc7d69b881780362aeb1e4ed949946d578354949805b9e5e74ec2870b8729"
    },
    {
      "name": "StopDuringStarting",
      "kind": "witness",
      "says": "A Stop can be saved while capture is still starting.",
      "sha256": "sha256:55933879beba145409441c30ebb3f872cdfcb332156e71b1f07ba5b175da6b9c"
    },
    {
      "name": "GapIsPossible",
      "kind": "witness",
      "says": "Capture can restart in the same recording and emit a gap notice.",
      "sha256": "sha256:29c32b86c2b7a46852b58f5a8ca005b8c90dbe3946f9bfa3783b7180c4e934dc"
    },
    {
      "name": "ExhaustedRestarts",
      "kind": "witness",
      "says": "A recording can reach its restart limit and be queued for finishing.",
      "sha256": "sha256:eb124aec17c9591b9ebb3911ca28df2ae55cd526397554dcf3f8422b0d713741"
    },
    {
      "name": "CrashWithUnshownEnd",
      "kind": "witness",
      "says": "A crash can leave an unshown end saved for the next launch.",
      "sha256": "sha256:47c9bd12d2c74e923fd11e7d263e3d85e5732c60cc8fe3dafb5ec55e225b8a41"
    },
    {
      "name": "CrashDuringRestart",
      "kind": "witness",
      "says": "A crash can interrupt a restart whose attempt has already been counted.",
      "sha256": "sha256:e0723f7be459df53577191f267f76b2c835898a3260618eaa2760f18bb0bd17d"
    },
    {
      "name": "RestartAfterInterruptedRestart",
      "kind": "witness",
      "says": "After a crash interrupts a counted restart, the same recording can request one more restart with both attempts counted.",
      "sha256": "sha256:9b5112771c7ea91bb87e3d513dd70c4a40b2b2e12ba69fa9df61225d7b1cb64f"
    },
    {
      "name": "StartUnchecked",
      "kind": "bug",
      "says": "A faulty Start accepts a second recording while one is running.",
      "expect": "OneRunning",
      "sha256": "sha256:78b082bdf86aad1def35ed39a453f000a7c2b9327cc256590c88577ee88b0f16",
      "code_behavior": "hypothetical"
    },
    {
      "name": "ForgetWhenFinishRequested",
      "kind": "bug",
      "says": "A faulty finish dispatch forgets the recording before finishing has replied.",
      "expect": "EveryAcceptedIsAccountedFor",
      "sha256": "sha256:b67b5807f2829173be7d330bd8a80882b1b7e067f5b67dd37eef62a3067117c0",
      "code_behavior": "hypothetical"
    },
    {
      "name": "ForgetWhenNoticeRequested",
      "kind": "bug",
      "says": "A faulty end notice forgets the recording before the caller confirms display.",
      "expect": "EveryAcceptedIsAccountedFor",
      "sha256": "sha256:e97506360052fe0291b2d39a0f07072a0edfcb764ab569827bf144aed2d3fdb8",
      "code_behavior": "hypothetical"
    },
    {
      "name": "IgnoreStopDuringStarting",
      "kind": "bug",
      "says": "A faulty Stop received during startup leaves the Stop unsaved.",
      "expect": "StopIsLatched",
      "sha256": "sha256:024bfa8a066ffbcdfa065bf7c76c8d8c75caaadd8db799c4e039726eb3bc50f7",
      "code_behavior": "current"
    },
    {
      "name": "FinishWhileWriting",
      "kind": "bug",
      "says": "A faulty finish dispatch joins pieces while capture can still write them.",
      "expect": "FinishAfterCapture",
      "sha256": "sha256:e2eefe0fa0422aecdced30d0fba8bac8928df6ac1155c0e185d0a2c6443ece20",
      "code_behavior": "hypothetical"
    },
    {
      "name": "RefuseStartWhileFinishing",
      "kind": "bug",
      "says": "A faulty Start is refused while an earlier recording is being finished even though no recording is running.",
      "expect": "StartDecision",
      "sha256": "sha256:5284f4cc9203076fe2b6027745e8dcfb508bd32dc5036f2fc990751cd8982b7b",
      "code_behavior": "current"
    },
    {
      "name": "StopBeforeSaved",
      "kind": "bug",
      "says": "A faulty Stop asks capture to stop before saving the Stop in the record.",
      "expect": "StopIsLatched",
      "sha256": "sha256:6981d99c90449d39302d52251de5966745b43cb6cf1962849195a61792e2bb68",
      "code_behavior": "hypothetical"
    }
  ]
}
